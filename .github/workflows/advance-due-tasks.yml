name: Advance due Linear tasks

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 04:00 PT / 03:00 PST — one hour after recurring-tasks
  workflow_dispatch:

jobs:
  advance:
    name: Advance due Linear tasks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run advance due tasks
        run: node scripts/advance-due-tasks.js
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
